{% macro tr(uk, en) -%}<span data-no-translate data-ops-uk="{{ uk }}" data-ops-en="{{ en }}">{{ uk }}</span>{%- endmacro %}
{% macro verification(csrf) %}
<input type="hidden" name="csrf" value="{{ csrf }}">
<label class="form-label">{{ tr('Ваш пароль', 'Your password') }}<input class="form-control" type="password" name="password" autocomplete="current-password" required></label>
<label class="d-block my-2"><input type="checkbox" name="confirm" value="yes" required> {{ tr('Підтверджую дію', 'Confirm this action') }}</label>
{% endmacro %}
